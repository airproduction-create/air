<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>AIR — Artificial Intelligence Revelations | AI Content Studio</title>
    <meta name="description" content="AIR is an AI content studio that reveals the truth behind your brand. Cinematic advertising, branded content, and bespoke campaigns for those who want to be understood, not merely seen." />
    <meta name="author" content="AIR — Artificial Intelligence Revelations" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#18140F" />
    <link rel="canonical" href="https://airstu.netlify.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AIR" />
    <meta property="og:title" content="AIR — We don't make content. We reveal truth." />
    <meta property="og:description" content="An AI content studio built on a single conviction: the most powerful creative work doesn't persuade — it reveals. Cinematic advertising and branded content across 3 continents." />
    <meta property="og:url" content="https://airstu.netlify.app/" />
    <meta property="og:image" content="https://airstu.netlify.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AIR — Artificial Intelligence Revelations" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AIR — We don't make content. We reveal truth." />
    <meta name="twitter:description" content="An AI content studio built on a single conviction: the most powerful creative work doesn't persuade — it reveals." />
    <meta name="twitter:image" content="https://airstu.netlify.app/og-image.jpg" />
    <meta name="twitter:image:alt" content="AIR — Artificial Intelligence Revelations" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Structured Data: Organisation -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "AIR",
      "alternateName": "Artificial Intelligence Revelations",
      "url": "https://airstu.netlify.app",
      "logo": "https://airstu.netlify.app/favicon.svg",
      "description": "An AI content studio that creates cinematic advertising, branded content, and bespoke campaigns built on revelation, not persuasion.",
      "sameAs": [
        "https://www.linkedin.com/company/airproduction"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "we@airstu.co.za",
        "contactType": "customer service"
      },
      "areaServed": "Worldwide",
      "knowsAbout": ["AI content creation", "Cinematic advertising", "Branded content", "Campaign strategy"]
    }
    </script>

    <!-- Structured Data: WebSite (enables sitelinks search) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "AIR",
      "url": "https://airstu.netlify.app",
      "description": "AI content studio — cinematic advertising and branded content that reveals truth.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://airstu.netlify.app/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Fonts — Terra: Bricolage Grotesque (display), Instrument Serif (script accent), Archivo (body), Anton (hero) + JetBrains Mono (labels) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;500;600;700&family=Anton&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
